<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>欢迎来到幻想科技工作室</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        /* ----- 主题变量 (日/夜) 增强对比 ----- */
        :root {
            --bg-primary: #0b0719;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border-card: rgba(255, 255, 255, 0.08);
            --text-primary: rgba(255, 255, 255, 0.88);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.3);
            --text-highlight: rgba(255, 255, 255, 0.96);
            --shadow-card: 0 40px 120px rgba(0, 0, 0, 0.65);
            --glow-line: rgba(167, 139, 250, 0.2);
            --blob-opacity: 0.5;
            --title-gradient: linear-gradient(135deg, #ffffff 30%, #c4b5fd 70%, #7dd3fc);
            --nav-bg: rgba(255, 255, 255, 0.03);
            --input-bg: rgba(255, 255, 255, 0.04);
            --input-border: rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] {
            --bg-primary: #f0edf5;
            --bg-card: rgba(255, 255, 255, 0.45);
            --border-card: rgba(255, 255, 255, 0.4);
            --text-primary: rgba(20, 10, 30, 0.9);
            --text-secondary: rgba(40, 30, 60, 0.7);
            --text-muted: rgba(40, 30, 60, 0.45);
            --text-highlight: rgba(10, 5, 20, 0.98);
            --shadow-card: 0 40px 100px rgba(0, 0, 0, 0.08);
            --glow-line: rgba(120, 80, 200, 0.25);
            --blob-opacity: 0.12;
            --title-gradient: linear-gradient(135deg, #1a1028 20%, #6d4aff 70%, #0077be);
            --nav-bg: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(255, 255, 255, 0.15);
            --input-border: rgba(0, 0, 0, 0.1);
        }

        /* ----- 重置 & 基础 ----- */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            padding: 30px;
            overflow-x: hidden;
            position: relative;
            transition: background 0.5s ease;
        }

        /* ----- 动态背景光晕 ----- */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            opacity: var(--blob-opacity);
            pointer-events: none;
            z-index: 0;
            animation: blobFloat 24s ease-in-out infinite alternate;
            transition: opacity 0.8s ease;
        }
        .bg-blob--1 { width: 700px; height: 700px; top: -250px; left: -180px; background: radial-gradient(circle, #7b4eff, #311b7a); animation-duration: 26s; }
        .bg-blob--2 { width: 650px; height: 650px; bottom: -200px; right: -180px; background: radial-gradient(circle, #00b9f1, #005f99); animation-duration: 30s; animation-delay: -8s; }
        .bg-blob--3 { width: 500px; height: 500px; top: 30%; left: 55%; transform: translateX(-50%); background: radial-gradient(circle, #f72585, #6a0dad); animation-duration: 34s; animation-delay: -14s; }
        .bg-blob--4 { width: 400px; height: 400px; bottom: 10%; left: 10%; background: radial-gradient(circle, #f9c74f, #f8961e); animation-duration: 28s; animation-delay: -4s; }
        [data-theme="light"] .bg-blob { opacity: 0.10; filter: blur(100px); }

        @keyframes blobFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(80px, -50px) scale(1.15); }
            66% { transform: translate(-40px, 60px) scale(0.85); }
            100% { transform: translate(50px, 40px) scale(1.05); }
        }

        /* ----- 玻璃卡片 ----- */
        .glass-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            padding: 24px 30px 30px;
            background: var(--bg-card);
            backdrop-filter: blur(40px) saturate(1.6);
            -webkit-backdrop-filter: blur(40px) saturate(1.6);
            border-radius: 48px;
            border: 1px solid var(--border-card);
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: background 0.5s ease, box-shadow 0.5s ease, border-color 0.5s ease;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }
        .glass-card:hover {
            transform: translateY(-4px) scale(1.003);
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.10);
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), #a78bfa, rgba(255, 255, 255, 0.15), transparent);
            border-radius: 100%;
            filter: blur(1px);
        }
        .glass-card::after {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 120%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(120, 80, 255, 0.06), transparent 70%);
            pointer-events: none;
            border-radius: 50%;
            z-index: 0;
        }

        /* ----- 导航栏 ----- */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 4px 12px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
            position: relative;
            z-index: 2;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-left .nav-item {
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            border: none;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .nav-left .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }
        .nav-left .nav-item.active {
            background: rgba(167, 139, 250, 0.15);
            color: #a78bfa;
        }
        .nav-left .nav-item .material-symbols-outlined { font-size: 20px; }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .nav-right .user-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-right .user-area .username {
            font-weight: 500;
            color: var(--text-primary);
        }
        .btn-icon {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }
        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(167, 139, 250, 0.3);
            color: var(--text-primary);
        }
        .btn-icon .material-symbols-outlined { font-size: 18px; }
        .theme-toggle {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 4px 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            transition: 0.25s;
        }
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .theme-toggle .material-symbols-outlined { font-size: 22px; }

        /* ----- 内容容器 ----- */
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            position: relative;
            z-index: 1;
            min-height: 400px;
        }
        .content-wrapper::-webkit-scrollbar { width: 4px; }
        .content-wrapper::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

        /* ----- 首页视图 ----- */
        #homeView { animation: fadeIn 0.3s; }
        #homeView .header { text-align: center; margin-bottom: 18px; }
        #homeView .header-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: 64px; height: 64px; border-radius: 24px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 12px; backdrop-filter: blur(6px); transition: all 0.4s ease;
        }
        #homeView .header-icon .material-symbols-outlined {
            font-size: 36px; font-variation-settings: 'FILL' 0, 'wght' 300;
            background: linear-gradient(135deg, #e0d7ff, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        #homeView .header h1 {
            font-size: 2.6rem; font-weight: 700; letter-spacing: -0.02em;
            background: var(--title-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            line-height: 1.2; margin-bottom: 4px;
        }
        #homeView .header .subtitle {
            font-size: 0.9rem; font-weight: 400; letter-spacing: 0.4em;
            color: var(--text-secondary); text-transform: uppercase;
        }
        #homeView .divider {
            width: 100%; height: 1px; margin: 20px 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.07), var(--glow-line), rgba(255, 255, 255, 0.07), transparent);
        }
        #homeView .section { padding: 4px 0; }
        #homeView .section-label {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--text-secondary); margin-bottom: 8px; opacity: 0.8;
        }
        #homeView .section-label .material-symbols-outlined { font-size: 16px; color: #a78bfa; }
        #homeView .section p {
            font-size: 1.05rem; font-weight: 350; line-height: 1.7;
            color: var(--text-primary); letter-spacing: 0.01em; padding-left: 4px;
        }
        #homeView .section p .highlight {
            color: var(--text-highlight); font-weight: 500;
            background: linear-gradient(120deg, rgba(167, 139, 250, 0.2), rgba(125, 211, 252, 0.1));
            padding: 0 6px; border-radius: 6px; display: inline-block;
        }
        #homeView .section--owner {
            background: rgba(255, 255, 255, 0.02); border-radius: 20px;
            padding: 16px 20px 18px; margin-top: 2px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        #homeView .owner-row {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px;
        }
        #homeView .owner-avatar {
            display: flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 40px;
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(125, 211, 252, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.08); color: var(--text-secondary);
        }
        #homeView .owner-avatar .material-symbols-outlined { font-size: 24px; }
        #homeView .owner-badge {
            font-size: 0.75rem; font-weight: 400; color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04); padding: 2px 14px; border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #homeView .footer {
            margin-top: 20px; padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        #homeView .footer .slogan {
            display: flex; align-items: center; gap: 10px; font-size: 1.2rem; color: var(--text-secondary);
        }
        #homeView .footer .slogan .material-symbols-outlined { font-size: 28px; color: #a78bfa; }
        #homeView .footer .email-wrap {
            display: inline-flex; align-items: center; gap: 10px; font-size: 0.95rem;
            color: var(--text-secondary); text-decoration: none;
            padding: 6px 20px; border-radius: 60px;
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        #homeView .footer .email-wrap:hover {
            color: var(--text-primary); background: rgba(255, 255, 255, 0.06);
            border-color: rgba(167, 139, 250, 0.25);
        }
        #homeView .footer .support-text {
            font-size: 0.75rem; color: var(--text-secondary); opacity: 0.5; letter-spacing: 0.04em;
        }

        /* ----- 工具集视图 ----- */
        #toolsView { display: none; height: 100%; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .tools-layout {
            display: flex; gap: 20px; height: 100%; min-height: 400px;
        }
        .tool-list {
            width: 200px; flex-shrink: 0; overflow-y: auto; padding-right: 6px;
            border-right: 1px solid rgba(255, 255, 255, 0.05); max-height: 70vh;
        }
        .tool-list::-webkit-scrollbar { width: 3px; }
        .tool-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .tool-list-item {
            padding: 10px 14px; border-radius: 12px; margin-bottom: 4px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            color: var(--text-secondary); transition: all 0.2s;
            font-size: 0.9rem; border: none; background: transparent;
            width: 100%; text-align: left; font-family: inherit;
        }
        .tool-list-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
        .tool-list-item.active { background: rgba(167, 139, 250, 0.12); color: #a78bfa; }
        .tool-list-item .material-symbols-outlined { font-size: 20px; }

        .tool-panel {
            flex: 1; padding: 4px 0 4px 8px; overflow-y: auto; max-height: 70vh;
        }
        .tool-panel::-webkit-scrollbar { width: 4px; }
        .tool-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .tool-panel .tool-title {
            font-size: 1.3rem; font-weight: 600; margin-bottom: 16px;
            color: var(--text-primary); display: flex; align-items: center; gap: 10px;
        }
        .tool-panel .tool-title .material-symbols-outlined { font-size: 28px; color: #a78bfa; }
        .tool-content {
            display: flex; flex-direction: column; gap: 14px;
        }
        .tool-content .form-group {
            display: flex; flex-direction: column; gap: 4px;
        }
        .tool-content .form-group label {
            font-size: 0.85rem; color: var(--text-secondary);
        }
        .tool-content .form-group input,
        .tool-content .form-group select,
        .tool-content .form-group textarea {
            padding: 10px 14px; background: var(--input-bg);
            border: 1px solid var(--input-border); border-radius: 14px;
            color: var(--text-primary); font-size: 0.95rem; font-family: inherit;
            transition: 0.2s; outline: none; width: 100%;
        }
        .tool-content .form-group input:focus,
        .tool-content .form-group select:focus,
        .tool-content .form-group textarea:focus { border-color: #a78bfa; }
        .tool-content .btn-primary {
            padding: 10px 24px; border: none; border-radius: 40px;
            background: linear-gradient(135deg, #7b4eff, #a78bfa);
            color: #fff; font-size: 0.95rem; font-weight: 500;
            cursor: pointer; transition: 0.25s; font-family: inherit; align-self: flex-start;
        }
        .tool-content .btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 24px rgba(167, 139, 250, 0.3); }
        .tool-content .result-box {
            background: rgba(255, 255, 255, 0.03); border-radius: 16px;
            padding: 14px 18px; border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-primary); font-size: 0.95rem;
            min-height: 40px; white-space: pre-wrap; word-break: break-all;
        }
        .tool-content .result-box .qrcode-container { display: flex; justify-content: center; padding: 8px 0; }
        .tool-content .flex-row {
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
        }
        .tool-content .flex-row .form-group { flex: 1; min-width: 120px; }

        /* 响应式 */
        @media (max-width: 860px) {
            .glass-card { max-width: 100%; padding: 16px 18px 20px; border-radius: 32px; }
            .tools-layout { flex-direction: column; }
            .tool-list {
                width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05);
                max-height: 200px; display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 4px; padding-bottom: 8px;
            }
            .tool-list-item { white-space: nowrap; flex-shrink: 0; }
            .tool-panel { padding-left: 0; max-height: 60vh; }
            #homeView .header h1 { font-size: 2.0rem; }
            .navbar { flex-direction: column; align-items: stretch; gap: 8px; }
            .nav-right { justify-content: flex-end; }
        }
        @media (max-width: 480px) {
            #homeView .header h1 { font-size: 1.6rem; }
            .tool-list-item { font-size: 0.8rem; padding: 6px 10px; }
        }

        /* ----- 模态框 (登录/注册) 适配白天 ----- */
        .modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center; justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .modal-card {
            background: var(--bg-card);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-card);
            border-radius: 40px;
            padding: 40px 44px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--shadow-card);
            transition: background 0.4s, border-color 0.4s;
        }
        .modal-card .modal-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
        }
        .modal-card .modal-header h2 {
            font-size: 1.6rem; font-weight: 600; color: var(--text-primary);
        }
        .modal-card .modal-header .close-btn {
            background: none; border: none; color: var(--text-secondary);
            font-size: 28px; cursor: pointer; padding: 0 4px;
        }
        .modal-card .modal-header .close-btn:hover { color: var(--text-primary); }

        .tabs {
            display: flex; gap: 12px; margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding-bottom: 12px;
        }
        .tabs button {
            background: none; border: none; padding: 8px 18px;
            font-size: 1rem; font-weight: 500; color: var(--text-secondary);
            cursor: pointer; border-radius: 40px; transition: 0.2s; font-family: inherit;
        }
        .tabs button.active { background: rgba(167, 139, 250, 0.15); color: #a78bfa; }
        .tabs button:hover { background: rgba(255, 255, 255, 0.05); }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 0.85rem; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 6px;
        }
        .form-group input {
            width: 100%; padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border); border-radius: 16px;
            color: var(--text-primary); font-size: 1rem; font-family: inherit;
            transition: 0.2s; outline: none;
        }
        .form-group input:focus { border-color: #a78bfa; background: rgba(255, 255, 255, 0.06); }
        .form-group input::placeholder { color: var(--text-secondary); opacity: 0.5; }

        .form-actions {
            display: flex; flex-direction: column; gap: 12px; margin-top: 8px;
        }
        .form-actions .btn-primary {
            padding: 14px; border: none; border-radius: 40px;
            background: linear-gradient(135deg, #7b4eff, #a78bfa);
            color: #fff; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: 0.25s; font-family: inherit;
        }
        .form-actions .btn-primary:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(167, 139, 250, 0.3); }
        .form-actions .btn-secondary {
            padding: 10px; border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px; background: transparent;
            color: var(--text-secondary); font-size: 0.9rem;
            cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .form-actions .btn-secondary:hover { background: rgba(255, 255, 255, 0.04); }
        .form-group .checkbox-group {
            display: flex; align-items: center; gap: 10px; margin-top: 4px;
        }
        .form-group .checkbox-group input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: #a78bfa; cursor: pointer;
        }
        .form-group .checkbox-group label {
            margin-bottom: 0; font-weight: 400; cursor: pointer; color: var(--text-secondary);
        }
        .error-msg { color: #f72585; font-size: 0.85rem; margin-top: 4px; min-height: 20px; }

        /* 模态框内白天文字适配 */
        .modal-card .form-group label,
        .modal-card .checkbox-group label,
        .modal-card .tabs button,
        .modal-card .modal-header h2 {
            color: var(--text-primary);
        }
        .modal-card .form-group input {
            color: var(--text-primary);
            background: var(--input-bg);
            border-color: var(--input-border);
        }
        .modal-card .form-group input::placeholder { color: var(--text-secondary); opacity: 0.6; }
        .modal-card .btn-secondary { color: var(--text-secondary); }
        .modal-card .btn-secondary:hover { background: rgba(255,255,255,0.05); }
        .modal-card .close-btn { color: var(--text-secondary); }
        .modal-card .close-btn:hover { color: var(--text-primary); }
        .modal-card .error-msg { color: #f72585; }
    </style>
</head>
<body>

    <div class="bg-blob bg-blob--1"></div>
    <div class="bg-blob bg-blob--2"></div>
    <div class="bg-blob bg-blob--3"></div>
    <div class="bg-blob bg-blob--4"></div>

    <!-- 主卡片 -->
    <main class="glass-card">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="nav-left">
                <button class="nav-item active" data-view="home">
                    <span class="material-symbols-outlined">home</span> 首页
                </button>
                <button class="nav-item" data-view="tools">
                    <span class="material-symbols-outlined">handyman</span> 工具集
                </button>

            <div class="nav-right">
                <div class="user-area" id="userArea">
                    <span class="material-symbols-outlined" style="font-size:20px;">account_circle</span>
                    <span class="username" id="userDisplay">未登录</span>
                    <button class="btn-icon" id="loginBtn">
                        <span class="material-symbols-outlined">login</span> 登录
                    </button>
                    <button class="btn-icon" id="logoutBtn" style="display:none;">
                        <span class="material-symbols-outlined">logout</span> 退出

        </nav>

        <!-- 内容区域 -->
        <div class="content-wrapper">
            <!-- 首页视图 -->
            <div id="homeView">
                <div class="header">
                    <div class="header-icon">
                        <span class="material-symbols-outlined">rocket_launch</span>
                    </div>
                    <h1>欢迎来到 幻想科技工作室</h1>
                    <div class="subtitle">FANCY THINK STUDIO</div>
                </div>
                <div class="divider"></div>
                <div class="section">
                    <div class="section-label">
                        <span class="material-symbols-outlined">description</span> 工作室简介
                    </div>
                    <p>
                        你好，这是一个网站，是我们工作室的网站，<br />
                        我们的工作室还没有成立，<span class="highlight">谢谢您的期待</span>。
                    </p>
                </div>
                <div class="divider"></div>
                <div class="section section--owner">
                    <div class="section-label">
                        <span class="material-symbols-outlined">person</span> 总负责人
                    </div>
                    <div class="owner-row">
                        <div class="owner-avatar">
                            <span class="material-symbols-outlined">account_circle</span>
                        </div>
                        <span class="owner-badge">创始人 · 技术主理</span>
                    </div>
                    <p>
                        我是一个喜欢搞科技的人，<br />
                        我现在准备成立一家工作室，<span class="highlight">感谢支持</span>。
                    </p>
                </div>
                <div class="divider"></div>
                <footer class="footer">
                    <div class="slogan">
                        <span class="material-symbols-outlined">cloud</span> 云启未来
                    </div>
                    <a href="mailto:jjia12818@gmail.com" class="email-wrap">
                        <span class="material-symbols-outlined">mail</span> jjia12818@gmail.com
                    </a>
                    <div class="support-text">— 期待与你相遇 —</div>
                </footer>
            </div>

            <!-- 工具集视图 -->
            <div id="toolsView">
                <div class="tools-layout">
                    <div class="tool-list" id="toolList"></div>
                    <div class="tool-panel" id="toolPanel">
                        <div class="tool-title">
                            <span class="material-symbols-outlined">handyman</span> 选择工具
                        </div>
                        <div class="tool-content">
                            <p style="color:var(--text-secondary);">从左侧选择一个工具开始使用。</p>
