    </main>

    <!-- 模态框 (登录/注册) -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modalTitle">登录</h2>
                <button class="close-btn" id="closeModal">✕</button>
            </div>
            <div class="tabs">
                <button class="active" data-tab="login">登录</button>
                <button data-tab="register">注册</button>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">用户名</label>
                    <input type="text" id="loginUsername" placeholder="输入用户名" required />
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" placeholder="输入密码" required />
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="rememberMe" />
                        <label for="rememberMe">记住我 (保存登录状态)</label>
                    </div>
                </div>
                <div class="error-msg" id="loginError"></div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">登录</button>
                    <button type="button" class="btn-secondary" id="switchToRegister">还没有账号？去注册</button>
                </div>
            </form>
            <form id="registerForm" style="display:none;">
                <div class="form-group">
                    <label for="regUsername">用户名</label>
                    <input type="text" id="regUsername" placeholder="设置用户名" required />
                </div>
                <div class="form-group">
                    <label for="regPassword">密码</label>
                    <input type="password" id="regPassword" placeholder="设置密码" required />
                </div>
                <div class="form-group">
                    <label for="regConfirm">确认密码</label>
                    <input type="password" id="regConfirm" placeholder="再次输入密码" required />
                </div>
                <div class="error-msg" id="regError"></div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">注册</button>
                    <button type="button" class="btn-secondary" id="switchToLogin">已有账号？去登录</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ---- 工具定义 (20个真正实用的) ----
            const tools = [{
                id: 'calculator',
                name: '计算器',
                icon: 'calculate',
                render: renderCalculator
            }, {
                id: 'unit-converter',
                name: '单位转换 (长度)',
                icon: 'swap_horiz',
                render: renderUnitConverter
            }, {
                id: 'countdown',
                name: '倒计时',
                icon: 'timer',
                render: renderCountdown
            }, {
                id: 'random-number',
                name: '随机数生成',
                icon: 'casino',
                render: renderRandomNumber
            }, {
                id: 'color-picker',
                name: '颜色拾取',
                icon: 'palette',
                render: renderColorPicker
            }, {
                id: 'text-stats',
                name: '文本统计',
                icon: 'text_fields',
                render: renderTextStats
            }, {
                id: 'qrcode-gen',
                name: '二维码生成',
                icon: 'qr_code',
                render: renderQrCode
            }, {
                id: 'password-gen',
                name: '密码生成',
                icon: 'vpn_key',
                render: renderPasswordGen
            }, {
                id: 'bmi',
                name: 'BMI计算',
                icon: 'fitness_center',
                render: renderBmi
            }, {
                id: 'date-diff',
                name: '日期差计算',
                icon: 'date_range',
                render: renderDateDiff
            }, {
                id: 'stopwatch',
                name: '计时器 (秒表)',
                icon: 'hourglass_top',
                render: renderStopwatch
            }, {
                id: 'notes',
                name: '便签 (本地)',
                icon: 'note',
                render: renderNotes
            }, {
                id: 'todo',
                name: '待办列表 (本地)',
                icon: 'checklist',
                render: renderTodo
            }, {
                id: 'color-convert',
                name: '色值转换 (HEX/RGB)',
                icon: 'colorize',
                render: renderColorConvert
            }, {
                id: 'countdown-date',
                name: '纪念日倒计时',
                icon: 'event',
                render: renderCountdownDate
            }, {
                id: 'word-count',
                name: '高级字数统计',
                icon: 'sort',
                render: renderWordCount
            }, {
                id: 'json-format',
                name: 'JSON格式化',
                icon: 'code',
                render: renderJsonFormat
            }, {
                id: 'timestamp',
                name: '时间戳转换',
                icon: 'schedule',
                render: renderTimestamp
            }, {
                id: 'uuid-gen',
                name: 'UUID生成器',
                icon: 'fingerprint',
                render: renderUuidGen
            }, {
                id: 'base64',
                name: 'Base64编解码',
                icon: 'transform',
                render: renderBase64
            }];

            // ---- DOM refs ----
            const toolListEl = document.getElementById('toolList');
            const toolPanelEl = document.getElementById('toolPanel');
            const homeView = document.getElementById('homeView');
            const toolsView = document.getElementById('toolsView');
            const navItems = document.querySelectorAll('.nav-item');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const userDisplay = document.getElementById('userDisplay');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const authModal = document.getElementById('authModal');
            const closeModal = document.getElementById('closeModal');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginUsername = document.getElementById('loginUsername');
            const loginPassword = document.getElementById('loginPassword');
            const rememberMe = document.getElementById('rememberMe');
            const regUsername = document.getElementById('regUsername');
            const regPassword = document.getElementById('regPassword');
            const regConfirm = document.getElementById('regConfirm');
            const loginError = document.getElementById('loginError');
            const regError = document.getElementById('regError');
            const switchToRegister = document.getElementById('switchToRegister');
            const switchToLogin = document.getElementById('switchToLogin');
            const tabs = document.querySelectorAll('.tabs button');
            const modalTitle = document.getElementById('modalTitle');

            // ---- 存储键 ----
            const STORAGE_USERS = 'fancy_users';
            const STORAGE_REMEMBER = 'fancy_remember';
            const STORAGE_CURRENT = 'fancy_current';
            const STORAGE_THEME = 'fancy_theme';

            // ---- 工具函数 ----
            function getUsers() { try { return JSON.parse(localStorage.getItem(STORAGE_USERS)) || {}; } catch { return {}; } }

            function saveUsers(users) { localStorage.setItem(STORAGE_USERS, JSON.stringify(users)); }

            function getRemember() { try { return JSON.parse(localStorage.getItem(STORAGE_REMEMBER)); } catch { return null; } }

            function saveRemember(data) {
                if (data) localStorage.setItem(STORAGE_REMEMBER, JSON.stringify(data));
                else localStorage.removeItem(STORAGE_REMEMBER);
            }

            function getCurrentUser() { return localStorage.getItem(STORAGE_CURRENT) || null; }

            function setCurrentUser(username) {
                if (username) localStorage.setItem(STORAGE_CURRENT, username);
                else localStorage.removeItem(STORAGE_CURRENT);
            }

            // ---- 主题 ----
            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                themeIcon.textContent = theme === 'light' ? 'light_mode' : 'dark_mode';
                localStorage.setItem(STORAGE_THEME, theme);
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme') || 'dark';
                setTheme(current === 'dark' ? 'light' : 'dark');
            }
            (function initTheme() {
                const saved = localStorage.getItem(STORAGE_THEME);
                if (saved) setTheme(saved);
                else setTheme('dark');
            })();
            themeToggle.addEventListener('click', toggleTheme);

            // ---- 导航切换 ----
            function switchView(view) {
                if (view === 'home') {
                    homeView.style.display = 'block';
                    toolsView.style.display = 'none';
                    navItems.forEach(item => item.classList.toggle('active', item.dataset.view === 'home'));
                } else {
                    homeView.style.display = 'none';
                    toolsView.style.display = 'block';
                    navItems.forEach(item => item.classList.toggle('active', item.dataset.view === 'tools'));
                }
            }
            navItems.forEach(item => {
                item.addEventListener('click', function() { switchView(this.dataset.view); });
            });

            // ---- 工具列表渲染 ----
            function renderToolList() {
                toolListEl.innerHTML = '';
                tools.forEach((tool, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'tool-list-item' + (index === 0 ? ' active' : '');
                    btn.dataset.id = tool.id;
                    btn.innerHTML = `<span class="material-symbols-outlined">${tool.icon}</span> ${tool.name}`;
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.tool-list-item').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        renderToolPanel(tool.id);
                    });
                    toolListEl.appendChild(btn);
                });
                if (tools.length) renderToolPanel(tools[0].id);
            }

            function renderToolPanel(toolId) {
                const tool = tools.find(t => t.id === toolId);
                if (!tool) return;
                toolPanelEl.innerHTML = '';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'tool-title';
                titleDiv.innerHTML = `<span class="material-symbols-outlined">${tool.icon}</span> ${tool.name}`;
                toolPanelEl.appendChild(titleDiv);
                const contentDiv = document.createElement('div');
                contentDiv.className = 'tool-content';
                tool.render(contentDiv);
                toolPanelEl.appendChild(contentDiv);
            }

            // ---- 工具渲染函数 (20个) ----

            // 1. 计算器
            function renderCalculator(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>表达式 (如 2+3*4)</label>
                        <input type="text" id="calcExpr" placeholder="输入数学表达式" value="2+3*4" />
                    </div>
                    <button class="btn-primary" id="calcBtn">计算</button>
                    <div class="result-box" id="calcResult">结果: 14</div>
                `;
                const btn = container.querySelector('#calcBtn');
                const result = container.querySelector('#calcResult');
                const expr = container.querySelector('#calcExpr');
                btn.addEventListener('click', function() {
                    try {
                        const val = Function('"use strict"; return (' + expr.value + ')')();
                        result.textContent = '结果: ' + val;
                    } catch (e) {
                        result.textContent = '错误: 无效表达式';
                    }
                });
                expr.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
                btn.click();
            }

            // 2. 单位转换 (长度)
            function renderUnitConverter(container) {
                container.innerHTML = `
                    <div class="flex-row">
                        <div class="form-group">
                            <label>数值</label>
                            <input type="number" id="ucValue" value="1" step="any" />
                        </div>
                        <div class="form-group">
                            <label>从</label>
                            <select id="ucFrom">
                                <option value="m">米</option>
                                <option value="km">千米</option>
                                <option value="cm">厘米</option>
                                <option value="mm">毫米</option>
                                <option value="ft">英尺</option>
                                <option value="in">英寸</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>到</label>
                            <select id="ucTo">
                                <option value="m">米</option>
                                <option value="km">千米</option>
                                <option value="cm">厘米</option>
                                <option value="mm">毫米</option>
                                <option value="ft">英尺</option>
                                <option value="in">英寸</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn-primary" id="ucBtn">转换</button>
                    <div class="result-box" id="ucResult">结果: 1 米 = 1 米</div>
                `;
                const rates = { m: 1, km: 1000, cm: 0.01, mm: 0.001, ft: 0.3048, in: 0.0254 };
                const names = { m: '米', km: '千米', cm: '厘米', mm: '毫米', ft: '英尺', in: '英寸' };
                const btn = container.querySelector('#ucBtn');
                const result = container.querySelector('#ucResult');
                const value = container.querySelector('#ucValue');
                const from = container.querySelector('#ucFrom');
                const to = container.querySelector('#ucTo');

                function convert() {
                    const v = parseFloat(value.value) || 0;
                    const f = from.value;
                    const t = to.value;
                    const meters = v * rates[f];
                    const out = meters / rates[t];
                    result.textContent = `${v} ${names[f]} = ${out.toFixed(6)} ${names[t]}`;
                }
                btn.addEventListener('click', convert);
                [value, from, to].forEach(el => el.addEventListener('change', convert));
                convert();
            }

            // 3. 倒计时
            function renderCountdown(container) {
                container.innerHTML = `
                    <div class="flex-row">
                        <div class="form-group">
                            <label>分钟</label>
                            <input type="number" id="cdMin" value="1" min="0" />
                        </div>
                        <div class="form-group">
                            <label>秒</label>
                            <input type="number" id="cdSec" value="0" min="0" max="59" />
                        </div>
                    </div>
                    <button class="btn-primary" id="cdStart">开始</button>
                    <button class="btn-secondary" id="cdReset" style="padding:10px 20px;border:1px solid var(--input-border);border-radius:40px;background:transparent;color:var(--text-secondary);cursor:pointer;">重置</button>
                    <div class="result-box" id="cdDisplay">剩余: 01:00</div>
                `;
                let timer = null;
                let totalSeconds = 60;
                const display = container.querySelector('#cdDisplay');
                const minInput = container.querySelector('#cdMin');
                const secInput = container.querySelector('#cdSec');
                const startBtn = container.querySelector('#cdStart');
                const resetBtn = container.querySelector('#cdReset');

                function updateDisplay() {
                    const m = Math.floor(totalSeconds / 60);
                    const s = totalSeconds % 60;
                    display.textContent = `剩余: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                    if (totalSeconds <= 0) {
                        display.textContent = '⏰ 时间到!';
                        clearInterval(timer);
                        timer = null;
                    }
                }

                function stopTimer() { if (timer) { clearInterval(timer);
                        timer = null; } }

                function startCountdown() {
                    stopTimer();
                    const mins = parseInt(minInput.value) || 0;
                    const secs = parseInt(secInput.value) || 0;
                    totalSeconds = mins * 60 + secs;
                    if (totalSeconds <= 0) { totalSeconds = 60;
                        minInput.value = 1;
                        secInput.value = 0; }
                    updateDisplay();
                    timer = setInterval(() => {
                        if (totalSeconds > 0) { totalSeconds--;
                            updateDisplay(); } else { clearInterval(timer);
                            timer = null; }
                    }, 1000);
                }
                startBtn.addEventListener('click', startCountdown);
                resetBtn.addEventListener('click', function() {
                    stopTimer();
                    const mins = parseInt(minInput.value) || 0;
                    const secs = parseInt(secInput.value) || 0;
                    totalSeconds = mins * 60 + secs;
                    if (totalSeconds <= 0) { totalSeconds = 60;
                        minInput.value = 1;
                        secInput.value = 0; }
                    updateDisplay();
                });
                setTimeout(() => resetBtn.click(), 50);
            }

            // 4. 随机数生成
            function renderRandomNumber(container) {
                container.innerHTML = `
                    <div class="flex-row">
                        <div class="form-group">
                            <label>最小值</label>
                            <input type="number" id="rnMin" value="1" />
                        </div>
                        <div class="form-group">
                            <label>最大值</label>
                            <input type="number" id="rnMax" value="100" />
                        </div>
                    </div>
                    <button class="btn-primary" id="rnBtn">生成</button>
                    <div class="result-box" id="rnResult">随机数: 42</div>
                `;
                const btn = container.querySelector('#rnBtn');
                const result = container.querySelector('#rnResult');
                const minEl = container.querySelector('#rnMin');
                const maxEl = container.querySelector('#rnMax');

                function gen() {
                    const min = parseInt(minEl.value) || 0;
                    const max = parseInt(maxEl.value) || 100;
                    if (min > max) { result.textContent = '错误: 最小值不能大于最大值'; return; }
                    const num = Math.floor(Math.random() * (max - min + 1)) + min;
                    result.textContent = `随机数: ${num}`;
                }
                btn.addEventListener('click', gen);
                gen();
            }

            // 5. 颜色拾取
            function renderColorPicker(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>选择颜色</label>
                        <input type="color" id="cpColor" value="#6d4aff" style="height:60px;padding:4px;cursor:pointer;" />
                    </div>
                    <div class="result-box" id="cpResult">HEX: #6d4aff</div>
                `;
                const picker = container.querySelector('#cpColor');
                const result = container.querySelector('#cpResult');
                picker.addEventListener('input', function() {
                    result.textContent = `HEX: ${this.value.toUpperCase()}`;
                });
                picker.dispatchEvent(new Event('input'));
            }

            // 6. 文本统计
            function renderTextStats(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>输入文本</label>
                        <textarea id="tsText" rows="4" placeholder="输入任意文本...">Hello world! 你好世界。</textarea>
                    </div>
                    <button class="btn-primary" id="tsBtn">统计</button>
                    <div class="result-box" id="tsResult">字符数: 20 | 单词数: 4 | 行数: 1</div>
                `;
                const btn = container.querySelector('#tsBtn');
                const result = container.querySelector('#tsResult');
                const textarea = container.querySelector('#tsText');

                function stats() {
                    const txt = textarea.value;
                    const chars = txt.length;
                    const words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
                    const lines = txt.split(/\n/).length;
                    result.textContent = `字符数: ${chars} | 单词数: ${words} | 行数: ${lines}`;
                }
                btn.addEventListener('click', stats);
                stats();
            }

            // 7. 二维码生成 (需要QRCode库)
            function renderQrCode(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>输入文本或URL</label>
                        <input type="text" id="qrText" value="https://github.com" />
                    </div>
                    <button class="btn-primary" id="qrBtn">生成二维码</button>
                    <div class="result-box" id="qrResult"><div class="qrcode-container" id="qrcodeContainer"></div></div>
                `;
                const btn = container.querySelector('#qrBtn');
                const input = container.querySelector('#qrText');
                const containerDiv = container.querySelector('#qrcodeContainer');

                function generate() {
                    const text = input.value.trim() || 'https://example.com';
                    containerDiv.innerHTML = '';
                    try {
                        new QRCode(containerDiv, {
                            text: text,
                            width: 160,
                            height: 160,
                            colorDark: '#6d4aff',
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    } catch (e) {
                        containerDiv.innerHTML = '<p style="color:#f72585;">生成失败，请检查输入</p>';
                    }
                }
                btn.addEventListener('click', generate);
                setTimeout(generate, 100);
            }

            // 8. 密码生成
            function renderPasswordGen(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>密码长度</label>
                        <input type="number" id="pgLen" value="12" min="6" max="32" />
                    </div>
                    <div style="display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;">
                        <label><input type="checkbox" id="pgUpper" checked /> 大写</label>
                        <label><input type="checkbox" id="pgLower" checked /> 小写</label>
                        <label><input type="checkbox" id="pgDigit" checked /> 数字</label>
                        <label><input type="checkbox" id="pgSymbol" /> 符号</label>
                    </div>
                    <button class="btn-primary" id="pgBtn">生成密码</button>
                    <div class="result-box" id="pgResult">密码: </div>
                `;
                const btn = container.querySelector('#pgBtn');
                const result = container.querySelector('#pgResult');
                const lenEl = container.querySelector('#pgLen');
                const upper = container.querySelector('#pgUpper');
                const lower = container.querySelector('#pgLower');
                const digit = container.querySelector('#pgDigit');
                const symbol = container.querySelector('#pgSymbol');

                function generate() {
                    let chars = '';
                    if (upper.checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                    if (lower.checked) chars += 'abcdefghijklmnopqrstuvwxyz';
                    if (digit.checked) chars += '0123456789';
                    if (symbol.checked) chars += '!@#$%^&*()_+-=';
                    if (!chars) { result.textContent = '请至少选择一种字符类型'; return; }
                    const len = parseInt(lenEl.value) || 12;
                    let password = '';
                    for (let i = 0; i < len; i++) {
                        password += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                    result.textContent = `密码: ${password}`;
                }
                btn.addEventListener('click', generate);
                generate();
            }

            // 9. BMI计算
            function renderBmi(container) {
                container.innerHTML = `
                    <div class="flex-row">
                        <div class="form-group">
                            <label>身高 (cm)</label>
                            <input type="number" id="bmiHeight" value="175" step="0.1" />
                        </div>
                        <div class="form-group">
                            <label>体重 (kg)</label>
                            <input type="number" id="bmiWeight" value="70" step="0.1" />
                        </div>
                    </div>
                    <button class="btn-primary" id="bmiBtn">计算BMI</button>
                    <div class="result-box" id="bmiResult">BMI: 22.9  (正常)</div>
                `;
                const btn = container.querySelector('#bmiBtn');
                const result = container.querySelector('#bmiResult');
                const h = container.querySelector('#bmiHeight');
                const w = container.querySelector('#bmiWeight');

                function calc() {
                    const height = parseFloat(h.value) / 100;
                    const weight = parseFloat(w.value);
                    if (!height || !weight) { result.textContent = '请输入有效数值'; return; }
                    const bmi = weight / (height * height);
                    let status = '';
                    if (bmi < 18.5) status = '偏瘦';
                    else if (bmi < 24) status = '正常';
                    else if (bmi < 28) status = '超重';
                    else status = '肥胖';
                    result.textContent = `BMI: ${bmi.toFixed(1)}  (${status})`;
                }
                btn.addEventListener('click', calc);
                calc();
            }

            // 10. 日期差计算
            function renderDateDiff(container) {
                container.innerHTML = `
                    <div class="flex-row">
                        <div class="form-group">
                            <label>开始日期</label>
                            <input type="date" id="ddStart" />
                        </div>
                        <div class="form-group">
                            <label>结束日期</label>
                            <input type="date" id="ddEnd" />
                        </div>
                    </div>
                    <button class="btn-primary" id="ddBtn">计算相差天数</button>
                    <div class="result-box" id="ddResult">相差: 0 天</div>
                `;
                const btn = container.querySelector('#ddBtn');
                const result = container.querySelector('#ddResult');
                const start = container.querySelector('#ddStart');
                const end = container.querySelector('#ddEnd');
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                start.value = today.toISOString().split('T')[0];
                end.value = tomorrow.toISOString().split('T')[0];

                function calc() {
                    const s = new Date(start.value);
                    const e = new Date(end.value);
                    if (isNaN(s) || isNaN(e)) { result.textContent = '请选择有效日期'; return; }
                    const diff = Math.ceil((e - s) / (1000 * 60 * 60 * 24));
                    result.textContent = `相差: ${diff} 天`;
                }
                btn.addEventListener('click', calc);
                calc();
            }

            // 11. 计时器 (秒表)
            function renderStopwatch(container) {
                container.innerHTML = `
                    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                        <button class="btn-primary" id="swStart">开始</button>
                        <button class="btn-secondary" id="swStop" style="padding:10px 20px;border:1px solid var(--input-border);border-radius:40px;background:transparent;color:var(--text-secondary);cursor:pointer;">暂停</button>
                        <button class="btn-secondary" id="swReset" style="padding:10px 20px;border:1px solid var(--input-border);border-radius:40px;background:transparent;color:var(--text-secondary);cursor:pointer;">重置</button>
                    </div>
                    <div class="result-box" id="swDisplay">00:00:00.0</div>
                `;
                let swTimer = null;
                let swSeconds = 0;
                let running = false;
                const display = container.querySelector('#swDisplay');
                const startBtn = container.querySelector('#swStart');
                const stopBtn = container.querySelector('#swStop');
                const resetBtn = container.querySelector('#swReset');

                function updateDisplay() {
                    const hrs = Math.floor(swSeconds / 3600);
                    const mins = Math.floor((swSeconds % 3600) / 60);
                    const secs = Math.floor(swSeconds % 60);
                    const tenth = Math.floor((swSeconds % 1) * 10);
                    display.textContent = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${tenth}`;
                }

                function startTimer() {
                    if (running) return;
                    running = true;
                    swTimer = setInterval(() => { swSeconds += 0.1;
                        updateDisplay(); }, 100);
                }

                function stopTimer() { if (swTimer) { clearInterval(swTimer);
                        swTimer = null; }
                    running = false; }

                startBtn.addEventListener('click', startTimer);
                stopBtn.addEventListener('click', stopTimer);
                resetBtn.addEventListener('click', function() { stopTimer();
                    swSeconds = 0;
                    updateDisplay(); });
                updateDisplay();
            }

            // 12. 便签 (本地存储)
            function renderNotes(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>便签内容</label>
                        <textarea id="noteText" rows="4" placeholder="写点什么..."></textarea>
                    </div>
                    <button class="btn-primary" id="noteSave">保存</button>
                    <div class="result-box" id="noteStatus">已保存</div>
                `;
                const textarea = container.querySelector('#noteText');
                const saveBtn = container.querySelector('#noteSave');
                const status = container.querySelector('#noteStatus');
                const saved = localStorage.getItem('fancy_note');
                if (saved) textarea.value = saved;
                saveBtn.addEventListener('click', function() {
                    localStorage.setItem('fancy_note', textarea.value);
                    status.textContent = '✅ 保存成功';
                    setTimeout(() => status.textContent = '已保存', 2000);
                });
            }

            // 13. 待办列表 (本地存储)
            function renderTodo(container) {
                container.innerHTML = `
                    <div class="flex-row">
                        <div class="form-group" style="flex:1;">
                            <input type="text" id="todoInput" placeholder="输入待办事项" />
                        </div>
                        <button class="btn-primary" id="todoAdd">添加</button>
                    </div>
                    <div class="result-box" id="todoList" style="min-height:60px;"></div>
                `;
                const input = container.querySelector('#todoInput');
                const addBtn = container.querySelector('#todoAdd');
                const list = container.querySelector('#todoList');
                let todos = JSON.parse(localStorage.getItem('fancy_todos')) || [];

                function renderTodos() {
                    if (todos.length === 0) { list.innerHTML = '暂无待办'; return; }
                    list.innerHTML = todos.map((t, i) =>
                        `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
                            <span style="${t.done ? 'text-decoration:line-through;opacity:0.6;' : ''}">${t.text}</span>
                            <span>
                                <button data-index="${i}" class="todo-toggle" style="background:none;border:none;color:#a78bfa;cursor:pointer;margin-right:8px;">${t.done ? '↩' : '✓'}</button>
                                <button data-index="${i}" class="todo-delete" style="background:none;border:none;color:#f72585;cursor:pointer;">✕</button>
                            </span>
                        </div>`
                    ).join('');
                    list.querySelectorAll('.todo-toggle').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const idx = parseInt(this.dataset.index);
                            todos[idx].done = !todos[idx].done;
                            localStorage.setItem('fancy_todos', JSON.stringify(todos));
                            renderTodos();
                        });
                    });
                    list.querySelectorAll('.todo-delete').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const idx = parseInt(this.dataset.index);
                            todos.splice(idx, 1);
                            localStorage.setItem('fancy_todos', JSON.stringify(todos));
                            renderTodos();
                        });
                    });
                }
                addBtn.addEventListener('click', function() {
                    const text = input.value.trim();
                    if (!text) return;
                    todos.push({ text, done: false });
                    localStorage.setItem('fancy_todos', JSON.stringify(todos));
                    input.value = '';
                    renderTodos();
                });
                input.addEventListener('keydown', e => { if (e.key === 'Enter') addBtn.click(); });
                renderTodos();
            }

            // 14. 色值转换 (HEX/RGB)
            function renderColorConvert(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>输入HEX (如 #6d4aff)</label>
                        <input type="text" id="ccHex" value="#6d4aff" />
                    </div>
                    <button class="btn-primary" id="ccBtn">转换</button>
                    <div class="result-box" id="ccResult">RGB: rgb(109, 74, 255)</div>
                `;
                const btn = container.querySelector('#ccBtn');
                const result = container.querySelector('#ccResult');
                const hexInput = container.querySelector('#ccHex');

                function convert() {
                    let hex = hexInput.value.trim();
                    if (hex.startsWith('#')) hex = hex.substring(1);
                    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
                    if (hex.length !== 6) { result.textContent = '无效HEX格式'; return; }
                    const r = parseInt(hex.substring(0, 2), 16);
                    const g = parseInt(hex.substring(2, 4), 16);
                    const b = parseInt(hex.substring(4, 6), 16);
                    if (isNaN(r) || isNaN(g) || isNaN(b)) { result.textContent = '无效HEX值'; return; }
                    result.textContent = `RGB: rgb(${r}, ${g}, ${b})  |  HEX: #${hex.toUpperCase()}`;
                }
                btn.addEventListener('click', convert);
                convert();
            }

            // 15. 纪念日倒计时
            function renderCountdownDate(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>目标日期</label>
                        <input type="date" id="cdDate" />
                    </div>
                    <button class="btn-primary" id="cdDateBtn">计算剩余天数</button>
                    <div class="result-box" id="cdDateResult">还有 0 天</div>
                `;
                const btn = container.querySelector('#cdDateBtn');
                const result = container.querySelector('#cdDateResult');
                const dateInput = container.querySelector('#cdDate');
                const future = new Date();
                future.setDate(future.getDate() + 30);
                dateInput.value = future.toISOString().split('T')[0];

                function calc() {
                    const target = new Date(dateInput.value);
                    const now = new Date();
                    if (isNaN(target)) { result.textContent = '请选择有效日期'; return; }
                    const diff = Math.ceil((target - now) / (1000 * 60 * 60 * 24));
                    if (diff < 0) result.textContent = `已过去 ${Math.abs(diff)} 天`;
                    else result.textContent = `还有 ${diff} 天`;
                }
                btn.addEventListener('click', calc);
                calc();
            }

            // 16. 高级字数统计
            function renderWordCount(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>输入文本</label>
                        <textarea id="wcText" rows="4" placeholder="输入文本...">Hello, 世界! 测试中文。</textarea>
                    </div>
                    <button class="btn-primary" id="wcBtn">统计</button>
                    <div class="result-box" id="wcResult">字符: 0 | 单词: 0 | 中文: 0</div>
                `;
                const btn = container.querySelector('#wcBtn');
                const result = container.querySelector('#wcResult');
                const textarea = container.querySelector('#wcText');

                function stats() {
                    const txt = textarea.value;
                    const chars = txt.length;
                    const words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
                    const chinese = (txt.match(/[\u4e00-\u9fa5]/g) || []).length;
                    result.textContent = `字符: ${chars} | 单词: ${words} | 中文: ${chinese}`;
                }
                btn.addEventListener('click', stats);
                stats();
            }

            // 17. JSON格式化
            function renderJsonFormat(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>输入JSON</label>
                        <textarea id="jsonInput" rows="4" placeholder='{"name":"test","age":20}'>{"name":"test","age":20}</textarea>
                    </div>
                    <button class="btn-primary" id="jsonBtn">格式化</button>
                    <button class="btn-secondary" id="jsonMinify" style="padding:10px 20px;border:1px solid var(--input-border);border-radius:40px;background:transparent;color:var(--text-secondary);cursor:pointer;margin-left:8px;">压缩</button>
                    <div class="result-box" id="jsonResult">格式化结果</div>
                `;
                const input = container.querySelector('#jsonInput');
                const formatBtn = container.querySelector('#jsonBtn');
                const minifyBtn = container.querySelector('#jsonMinify');
                const result = container.querySelector('#jsonResult');

                function formatJSON(compress) {
                    try {
                        const obj = JSON.parse(input.value);
                        const str = JSON.stringify(obj, null, compress ? 0 : 2);
                        result.textContent = str;
                    } catch (e) {
                        result.textContent = '错误: 无效JSON';
                    }
                }
                formatBtn.addEventListener('click', () => formatJSON(false));
                minifyBtn.addEventListener('click', () => formatJSON(true));
            }

            // 18. 时间戳转换
            function renderTimestamp(container) {
                container.innerHTML = `
                    <div class="flex-row">
                        <div class="form-group" style="flex:2;">
                            <label>时间戳 (秒)</label>
                            <input type="number" id="tsInput" step="1" />
                        </div>
                        <div class="form-group" style="flex:1;">
                            <button class="btn-primary" id="tsBtn" style="align-self:center;margin-top:20px;">转换</button>
                        </div>
                    </div>
                    <div class="result-box" id="tsResult">日期时间: </div>
                    <div class="form-group">
                        <label>当前时间戳: <span id="nowTs"></span></label>
                        <button class="btn-secondary" id="tsNow" style="padding:6px 16px;border:1px solid var(--input-border);border-radius:40px;background:transparent;color:var(--text-secondary);cursor:pointer;">获取当前</button>
                    </div>
                `;
                const input = container.querySelector('#tsInput');
                const btn = container.querySelector('#tsBtn');
                const result = container.querySelector('#tsResult');
                const nowSpan = container.querySelector('#nowTs');
                const nowBtn = container.querySelector('#tsNow');

                function convert(ts) {
                    if (isNaN(ts)) { result.textContent = '请输入有效数字'; return; }
                    const date = new Date(ts * 1000);
                    if (isNaN(date.getTime())) { result.textContent = '无效时间戳'; return; }
                    result.textContent = `日期时间: ${date.toLocaleString('zh-CN')}`;
                }

                btn.addEventListener('click', function() {
                    const val = parseFloat(input.value);
                    convert(val);
                });
                nowBtn.addEventListener('click', function() {
                    const now = Math.floor(Date.now() / 1000);
                    nowSpan.textContent = now;
                    input.value = now;
                    convert(now);
                });
                // 初始化
                const now = Math.floor(Date.now() / 1000);
                nowSpan.textContent = now;
                input.value = now;
                convert(now);
            }

            // 19. UUID生成器
            function renderUuidGen(container) {
                container.innerHTML = `
                    <button class="btn-primary" id="uuidBtn">生成 UUID</button>
                    <div class="result-box" id="uuidResult">UUID: </div>
                `;
                const btn = container.querySelector('#uuidBtn');
                const result = container.querySelector('#uuidResult');

                function generateUUID() {
                    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        const r = Math.random() * 16 | 0;
                        const v = c === 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                }
                btn.addEventListener('click', function() {
                    result.textContent = 'UUID: ' + generateUUID();
                });
                btn.click();
            }

            // 20. Base64编解码
            function renderBase64(container) {
                container.innerHTML = `
                    <div class="form-group">
                        <label>输入文本</label>
                        <textarea id="b64Input" rows="3" placeholder="输入文本...">Hello 世界</textarea>
                    </div>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                        <button class="btn-primary" id="b64Encode">编码 (Base64)</button>
                        <button class="btn-primary" id="b64Decode">解码</button>
                    </div>
                    <div class="result-box" id="b64Result">结果</div>
                `;
                const input = container.querySelector('#b64Input');
                const encodeBtn = container.querySelector('#b64Encode');
                const decodeBtn = container.querySelector('#b64Decode');
                const result = container.querySelector('#b64Result');

                encodeBtn.addEventListener('click', function() {
                    try {
                        result.textContent = btoa(unescape(encodeURIComponent(input.value)));
                    } catch (e) {
                        result.textContent = '编码失败: ' + e.message;
                    }
                });
                decodeBtn.addEventListener('click', function() {
                    try {
                        result.textContent = decodeURIComponent(escape(atob(input.value)));
                    } catch (e) {
                        result.textContent = '解码失败: 无效Base64';
                    }
                });
            }

            // ---- 初始化工具列表 ----
            renderToolList();

            // ---- 登录/注册逻辑 (复用之前) ----
            function openModal() {
                authModal.classList.add('active');
                showTab('login');
                loginError.textContent = '';
                regError.textContent = '';
                loginForm.reset();
                registerForm.reset();
            }

            function closeModalFn() { authModal.classList.remove('active'); }

            loginBtn.addEventListener('click', function(e) {
                if (getCurrentUser()) {
                    if (confirm('您已登录，是否切换账号？')) {
                        setCurrentUser(null);
                        saveRemember(null);
                        updateUI(null);
                        openModal();
                    }
                } else {
                    openModal();
                }
            });
            closeModal.addEventListener('click', closeModalFn);
            authModal.addEventListener('click', function(e) {
                if (e.target === authModal) closeModalFn();
            });

            function showTab(tab) {
                if (tab === 'login') {
                    loginForm.style.display = 'block';
                    registerForm.style.display = 'none';
                    modalTitle.textContent = '登录';
                    tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === 'login'));
                } else {
                    loginForm.style.display = 'none';
                    registerForm.style.display = 'block';
                    modalTitle.textContent = '注册';
                    tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === 'register'));
                }
                loginError.textContent = '';
                regError.textContent = '';
            }
            tabs.forEach(btn => {
                btn.addEventListener('click', function() { showTab(this.dataset.tab); });
            });
            switchToRegister.addEventListener('click', function(e) { e.preventDefault();
                showTab('register'); });
            switchToLogin.addEventListener('click', function(e) { e.preventDefault();
                showTab('login'); });

            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = regUsername.value.trim();
                const password = regPassword.value;
                const confirm = regConfirm.value;
                if (!username || username.length < 2) { regError.textContent = '用户名至少2个字符'; return; }
                if (password.length < 4) { regError.textContent = '密码至少4个字符'; return; }
                if (password !== confirm) { regError.textContent = '两次密码不一致'; return; }
                const users = getUsers();
                if (users[username]) { regError.textContent = '用户名已被注册'; return; }
                users[username] = password;
                saveUsers(users);
                regError.textContent = '';
                alert('注册成功！请登录。');
                showTab('login');
                loginUsername.value = username;
                loginPassword.value = '';
                registerForm.reset();
            });

            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = loginUsername.value.trim();
                const password = loginPassword.value;
                if (!username || !password) { loginError.textContent = '请输入用户名和密码'; return; }
                const users = getUsers();
                if (!users[username]) { loginError.textContent = '用户名不存在'; return; }
                if (users[username] !== password) { loginError.textContent = '密码错误'; return; }
                loginError.textContent = '';
                if (rememberMe.checked) { saveRemember({ username, password }); } else { saveRemember(null); }
                setCurrentUser(username);
                updateUI(username);
                closeModalFn();
                loginForm.reset();
            });

            logoutBtn.addEventListener('click', function() {
                setCurrentUser(null);
                saveRemember(null);
                updateUI(null);
            });

            function updateUI(username) {
                if (username) {
                    userDisplay.textContent = '欢迎，' + username;
                    loginBtn.style.display = 'none';
                    logoutBtn.style.display = 'inline-flex';
                } else {
                    userDisplay.textContent = '未登录';
                    loginBtn.style.display = 'inline-flex';
                    logoutBtn.style.display = 'none';
                }
            }

            function autoLogin() {
                const current = getCurrentUser();
                if (current) {
                    const users = getUsers();
                    if (users[current]) { updateUI(current); return; } else { setCurrentUser(null); }
                }
                const remember = getRemember();
                if (remember && remember.username && remember.password) {
                    const users = getUsers();
                    if (users[remember.username] === remember.password) {
                        setCurrentUser(remember.username);
                        updateUI(remember.username);
                        return;
                    } else { saveRemember(null); }
                }
                updateUI(null);
            }
            autoLogin();

            window.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && authModal.classList.contains('active')) closeModalFn();
            });

        })();
    </script>
</body>
</html>
